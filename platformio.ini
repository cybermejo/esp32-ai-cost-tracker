[env:aicost]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=4096
    -DESP32QSPI_FREQUENCY=80000000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
# R1 note: host tests run via test/Makefile (make); intentionally no [env:native].
# Power sequencing (cold-boot fix): XPowersLib drives the AXP2101 (BLDO1 panel
# rail + PWR key), Adafruit_XCA9554 drives the reset/SD expander — same
# libraries and call pattern as the TamaPoke project on this exact board.
lib_deps =
    lewisxhe/XPowersLib@^0.2.6
    adafruit/Adafruit XCA9554@^1.0.0
